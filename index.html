kho(){const f=($('#q')||{}).value||'',s=($('#fs')||{}).value||'',tp=[...new Set(S.words.map(w=>w.topic))];
const L=S.words.filter(w=>(w.en+w.vi).toLowerCase().includes(f.toLowerCase())&&(!s||w.st==s)&&(!($('#ft')||{}).value||w.topic==$('#ft').value));
$('#main').innerHTML=`<div class=card><input id=q placeholder="Tìm kiếm" value="${esc(f)}" oninput="V.kho();$('#q').focus()"><select id=fs onchange="V.kho()"><option value="">Mọi trạng thái</option>${['New','Learning','Reviewing','Remembered','Difficult'].map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')}</select><select id=ft onchange="V.kho()"><option value="">Mọi chủ đề</option>${tp.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
<div><input id=a1 placeholder="English"><input id=a2 placeholder="Tiếng Việt"><input id=a3 placeholder="IPA"><input id=a4 placeholder="Chủ đề"><button onclick="addW()">Thêm từ</button></div>
<div><button class=s onclick="csvOut()">Xuất CSV</button><button class=s onclick="$('#fc').click()">Nhập CSV</button><button class=s onclick="dl('kho-tu.json',JSON.stringify(S),'application/json')">Sao lưu JSON</button><button class=s onclick="$('#fj').click()">Khôi phục JSON</button><input id=fc type=file hidden accept=.csv onchange="csvIn(this)"><input id=fj type=file hidden accept=.json onchange="jsonIn(this)"></div></div>
<div class=card style="overflow:auto"><table><tr><th>English</th><th>Nghĩa</th><th>IPA</th><th>Trạng thái</th><th>Đúng/Sai</th><th>Ôn tiếp</th><th></th></tr>${L.map(w=>`<tr><td><b>${esc(w.en)}</b></td><td>${esc(w.vi)}</td><td>${esc(w.ipa)}</td><td>${w.st}</td><td>${w.ok}/${w.bad}</td><td>${w.next}</td><td><button class=s onclick="edW('${w.id}')">Sửa</button><button class=d onclick="delW('${w.id}')">Xóa</button></td></tr>`).join('')}</table></div>`},
road(){const d=dayN(),P=['Ngày 1–30: Nền tảng','Ngày 31–60: Tiếng Anh chuyên ngành','Ngày 61–90: Giao tiếp công việc','Ngày 91–120: Tiếng Anh trong cuộc họp'];
$('#main').innerHTML=`<div class=card><h3>Hôm nay là ngày ${d}/120</h3><div class=bar><i style="width:${Math.round(S.done.length/1.2)}%"></i></div><p>Đã hoàn thành ${S.done.length} ngày học.</p>${P.map((p,i)=>`<p class="${d>i*30&&d<=i*30+30?'g':''}"><b>${p}</b></p>`).join('')}</div>`},
stats(){const ok=S.words.reduce((a,w)=>a+w.ok,0),bad=S.words.reduce((a,w)=>a+w.bad,0),m=['New','Learning','Reviewing','Remembered','Difficult'];
$('#main').innerHTML=`<div class=card><h3>Thống kê</h3><p>Tỷ lệ đúng: ${ok+bad?Math.round(ok*100/(ok+bad)):0}% (${ok} đúng / ${bad} sai)</p><p>Ngày hoàn thành: ${S.done.length} – Streak: ${streak()}</p>${SK()}${m.map(x=>`<p>${x}: ${cnt(x)}<div class=bar><i style="width:${S.words.length?cnt(x)*100/S.words.length:0}%"></i></div></p>`).join('')}</div>`},
set(){$('#main').innerHTML=`<div class=card><h3>Cài đặt</h3><p>Tên: <input id=sn value="${esc(S.set.name)}"></p><p>Ngày bắt đầu: <input id=sd type=date value="${S.set.start}"></p><button onclick="S.set.name=$('#sn').value;S.set.start=$('#sd').value||T();save();hdr();alert('Đã lưu')">Lưu</button>
<hr><p>Đồng bộ đám mây: <b class=sy>${cloudSt}</b></p><button class=s onclick="cloudPull()">Đồng bộ ngay</button>
<hr><p>Xuất ra một file HTML mới có sẵn toàn bộ dữ liệu và cấu hình hiện tại. Người nhận mở file là thấy ngay, không cần nhập gì thêm. File gốc không thay đổi.</p><button onclick="exportHTML()">Export HTML</button></div>`}};
function finLearn(){const ws=S.words.filter(w=>w.st=='New').slice(0,6),t=T();ws.forEach(w=>{w.st='Learning';w.learned=t;w.next=add(t,1)});save();hdr();startQuiz(ws,'learn')}
function addW(){const e=$('#a1').value.trim(),v=$('#a2').value.trim();if(!e||!v)return alert('Cần nhập English và Tiếng Việt');
if(S.words.some(w=>w.en.toLowerCase()==e.toLowerCase()))return alert('Từ đã có trong kho');S.words.push(mk([e,v,$('#a3').value,'',$('#a4').value||'Khác'],S.words.length));save();V.kho()}
function edW(id){const w=S.words.find(x=>x.id==id),v=prompt('Nghĩa mới:',w.vi);if(v){w.vi=v;save();V.kho()}}
function delW(id){const w=S.words.find(x=>x.id==id);if(confirm('Xóa từ "'+w.en+'"?')){S.words=S.words.filter(x=>x.id!=id);save();V.kho()}}
function csvOut(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';dl('kho-tu.csv','\ufeff'+S.words.map(w=>[w.en,w.vi,w.ipa,w.type,w.topic,w.ex,w.exvi].map(q).join(',')).join('\n'),'text/csv')}
function csvIn(i){const f=i.files[0];if(!f)return;f.text().then(t=>{let n=0;t.replace(/^\ufeff/,'').split(/\r?\n/).forEach(l=>{if(!l.trim())return;const a=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(a.length<2||S.words.some(w=>w.en.toLowerCase()==a[0].toLowerCase()))return;S.words.push(mk(a,S.words.length));n++});save();alert('Đã nhập '+n+' từ (cột: English, Việt, IPA, Loại, Chủ đề, Ví dụ, Dịch ví dụ; không dùng dấu phẩy trong ô)');V.kho()})}
function jsonIn(i){const f=i.files[0];if(f)f.text().then(t=>{try{const d=JSON.parse(t);if(!d.words)throw 0;if(confirm('Thay toàn bộ dữ liệu hiện tại?')){S=d;save();hdr();V.kho()}}catch(e){alert('File JSON không hợp lệ')}})}
/* QUIZ */
function startQuiz(ws,kind){ws=sh(ws).slice(0,10);if(!ws.length)return alert('Không có từ để kiểm tra');Q={qs:ws.map((w,i)=>({w,t:i%2})),i:0,ok:0,bad:0,kind};qz()}
function qz(){const q=Q.qs[Q.i];if(!q)return endQ();const w=q.w,n=Q.i+1,m=$('#main');
if(q.t==0){const o=sh([w,...sh(S.words.filter(x=>x.id!=w.id)).slice(0,3)]);window._o=o;
m.innerHTML=`<div class=card><small>Câu ${n}/${Q.qs.length}</small><h2>${esc(w.en)} <small>${esc(w.ipa)}</small></h2><p>Chọn nghĩa đúng:</p>${o.map((x,i)=>`<button class=opt onclick="ans(window._o[${i}].id=='${w.id}')">${esc(x.vi)}</button>`).join('')}</div>`}
else m.innerHTML=`<div class=card><small>Câu ${n}/${Q.qs.length}</small><h2>${esc(w.vi)}</h2><p>Nhập từ tiếng Anh:</p><input id=ai autofocus onkeydown="if(event.key=='Enter')sub()"><button onclick="sub()">Trả lời</button></div>`}
function sub(){ans($('#ai').value.trim().toLowerCase()==Q.qs[Q.i].w.en.toLowerCase())}
function upd(w,ok){const t=T();w.last=t;if(ok){w.ok++;w.lv=Math.min(w.lv+1,5)}else{w.bad++;w.lv=Math.max(w.lv-1,0);w.lastBad=t}
w.next=add(t,ok?[1,3,7,14,30][Math.min(w.lv-1,4)]:1);w.st=(w.bad>=3&&w.bad*2>w.ok)?'Difficult':(w.ok>=3&&w.lv>=3)?'Remembered':w.lv>=1?'Reviewing':'Learning'}
function ans(ok){const w=Q.qs[Q.i].w;upd(w,ok);ok?Q.ok++:Q.bad++;let msg='';
if(!ok&&Q.kind!='rescue'){S.err.n++;if(S.err.n>=4&&!S.rescue){S.rescue={};return startRescue()}
msg=['','Lá vàng đầu tiên xuất hiện. Hãy đọc kỹ hơn nhé.','Bạn đã sai 2 lần hôm nay. Hãy đọc kỹ câu hỏi và ghi nhớ từ vựng.','Bạn đã sử dụng hết 3 lượt sai hôm nay. Hãy tập trung hơn nhé!'][S.err.n]}
save();hdr();$('#main').innerHTML=`<div class=card><h3 class="${ok?'g':'r'}">${ok?'Đúng':'Sai'}</h3><p><b>${esc(w.en)}</b> ${esc(w.ipa)} = ${esc(w.vi)}</p><p class=r>${msg}</p><button onclick="Q.i++;qz()">Tiếp tục</button></div>`}
function endQ(){const p=Math.round(Q.ok*100/Q.qs.length),k=Q.kind,ws=Q.qs.map(q=>q.w);
if(k=='rescue'){if(Q.bad==0&&p>=90){S.rescue=null;save();hdr();return $('#main').innerHTML=`<div class=card><h2 class=g>YOU SAVED YOUR TREE!</h2><p>Bạn đã cứu khu vườn của mình. Hãy tiếp tục hành trình học tiếng Anh.</p><button onclick="go('garden')">Về khu vườn</button></div>`}
return $('#main').innerHTML=`<div class=card><h3 class=r>Chưa đạt: ${p}%</h3><p>Cần tối thiểu 90% và không sai câu nào ở lượt cuối. Hãy xem lại các từ rồi làm lại.</p><button onclick="rescueView()">Học lại danh sách</button><button onclick="startQuiz(window._rw,'rescue')">Làm lại ngay</button></div>`}
$('#main').innerHTML=`<div class=card><h3>Kết quả: ${Q.ok}/${Q.qs.length} (${p}%)</h3><button onclick="go('garden')">Về khu vườn</button></div>`}
function startRescue(){const t=T();window._rw=S.words.filter(w=>w.st!='New').sort((a,b)=>((b.lastBad==t)*1e3+b.bad*10+(b.st!='Remembered'))-((a.lastBad==t)*1e3+a.bad*10+(a.st!='Remembered'))).slice(0,10);S.rescue={ids:window._rw.map(w=>w.id)};save();hdr();rescueView()}
function rescueView(){if(!window._rw||!window._rw.length)window._rw=S.words.filter(w=>(S.rescue.ids||[]).includes(w.id));if(!window._rw.length)window._rw=S.words.filter(w=>w.st!='New').slice(0,10);
$('#main').innerHTML=`<div class=card><h2 class=r>RESCUE MODE – CỨU CÂY</h2><p><b>OH NO! YOUR TREE IS WILTING!</b><br>Bạn đã sai 4 lần hôm nay. Hãy ôn tập 10 từ vựng thường sai nhất để cứu khu vườn của mình.</p>${tree()}${window._rw.map(w=>`<div class=w><b>${esc(w.en)}</b> ${esc(w.ipa)} = ${esc(w.vi)} (sai ${w.bad})</div>`).join('')}<button onclick="startQuiz(window._rw,'rescue')">Bắt đầu kiểm tra</button></div>`}

function build(s,B,W){const P='s'+s+'_',q=[],po=B.s.filter(x=>PL.includes(x[2])),
gm=(x,id)=>MC(id,'gra','Chọn từ đúng:<br><b>'+esc(bl(x[0],x[2]))+'</b><br><small>'+esc(x[1])+'</small>',[x[2],...PL.filter(p=>p!=x[2]).slice(0,2)],x[2],'Câu đầy đủ: '+esc(x[0])),
tr=(x,id)=>MC(id,'read','Dịch nghĩa câu:<br><b>'+esc(x[0])+'</b>',[x[1],...sh(BANK.flatMap(b=>b.s.map(y=>y[1])).filter(v=>v!=x[1])).slice(0,3)],x[1],esc(x[0])+' = '+esc(x[1])),
vm=(w,id)=>MC(id,'voc','Nghĩa của <b>'+esc(w.en)+'</b> là gì?',[w.vi,...sh(S.words.filter(y=>y.id!=w.id)).slice(0,3).map(y=>y.vi)],w.vi,esc(w.en)+' = '+esc(w.vi),{w:w.id}),
rq=(x,id)=>MC(id,'read',esc(x[0]),x[1],x[1][x[2]],'Đáp án: '+esc(x[1][x[2]]));

if(s==1){q.push({id:P+'i',t:'info',p:'<h3>Ngữ pháp: '+esc(B.t)+'</h3>'+B.g});po.slice(0,2).forEach((x,i)=>q.push(gm(x,P+i)))}
if(s==2)B.s.slice(0,4).forEach((x,i)=>q.push(TX(P+i,'sen','Điền từ còn thiếu:<br><b>'+esc(bl(x[0],x[2]))+'</b><br><small>'+esc(x[1])+'</small>',[x[2]],x[0],'Câu đầy đủ: '+esc(x[0]))));

if(s==4)B.s.slice(2,5).forEach((x,i)=>q.push({id:P+i,sk:'sen',t:'ord',p:'Sắp xếp thành câu:<br><small>'+esc(x[1])+'</small>',o:sh(x[0].replace(/[.?!,]/g,'').split(' ')),a:[nz(x[0])],m:x[0],e:'Câu đúng: '+esc(x[0])}));

if(s==8)q.push({id:P+'0',sk:'work',sk2:'wri',t:'free',p:esc(B.u.p),h:B.u.h,kw:B.u.k,m:B.u.m,e:'Câu mẫu: '+esc(B.u.m)});

if(s==10){let n=0;const f=o=>(o.f=1,q.push(o));W.slice(0,3).forEach(w=>f(vm(w,P+n++)));po.slice(0,2).forEach(x=>f(gm(x,P+n++)));f(tr(B.s[1],P+n++));f(tr(B.s[4],P+n++));f(rq(B.rd.q[0],P+n++))}

const cur=s=>{const L=S.lesson;return build(s,BANK[L.n],L.w.map(id=>S.words.find(w=>w.id==id)).filter(Boolean))};
function enter(s){const L=S.lesson;L.step=s;L.pend=cur(s).map(q=>q.id);L.tot=cur(s).filter(q=>q.t!='info').length;L.ok=0;L.tried={};L.fd=0;save();LS()}
function startLesson(){const W=S.words.filter(w=>w.st=='New').slice(0,5);S.lesson={d:T(),n:S.ln||0,w:W.map(w=>w.id),step:0,pend:[],miss:{},tried:{},ok:0,tot:0,sc:[]};enter(0)}
function LS(){const L=S.lesson,m=$('#main'),ban=S.rescue?'<div class=card style="border-left:5px solid #c0392b">RESCUE MODE đang bật. Bạn vẫn học tiếp bài hôm nay; mọi câu sai đều có giải thích và được làm lại.</div>':'';
if(!L){if(S.done.includes(T()))return m.innerHTML=ban+'<div class=card><h3 class=g>Hôm nay bạn đã hoàn thành bài học.</h3><p>Hãy ôn tập từ cần ôn, rồi quay lại vào ngày mai.</p></div>';
const li=S.ln||0;if(li>=BANK.length)return m.innerHTML=ban+'<div class=card>Đã hết bài trong ngân hàng bài học hiện có ('+BANK.length+' bài). Cần bổ sung bài mới.</div>';
if(S.words.filter(w=>w.st=='New').length<3)return m.innerHTML=ban+'<div class=card>Kho từ còn dưới 3 từ mới. Hãy nhập thêm từ ở mục Kho từ.</div>';
return m.innerHTML=ban+`<div class=card><h3>Bài ${li+1}: ${esc(BANK[li].t)}</h3><p>11 bước, khoảng 25–40 phút. Làm xong bước này mới mở bước sau. Tiến độ được lưu sau mỗi câu.</p><button onclick="startLesson()">Bắt đầu bài hôm nay</button></div>`}
stepRender(ban)}
function stepRender(ban){const L=S.lesson;if(!L.pend.length)return fin();const q=cur(L.step).find(x=>x.id==L.pend[0]);if(!q){L.pend.shift();save();return stepRender(ban)}
window.CQ=q;window._pk=[];let b='';
if(q.t=='info')b=q.p+'<button onclick="pass()">Tiếp tục</button>';
else if(q.t=='mc')b=q.p+q.o.map((x,i)=>`<button class=opt onclick="gr(CQ.o[${i}]==CQ.a[0])">${esc(x)}</button>`).join('');
else if(q.t=='txt')b=q.p+'<br><input id=ai style="width:90%" onkeydown="if(event.key==\'Enter\')gt()"><button onclick="gt()">Trả lời</button>';
else if(q.t=='ord')b=q.p+'<p id=pk style="min-height:34px;font-size:18px"></p>'+q.o.map((x,i)=>`<button id=t${i} class=s onclick="pk(${i})">${esc(x)}</button>`).join('')+'<p><button onclick="stepRender()">Xóa</button><button onclick="go2()">Kiểm tra</button></p>';
else b=q.p+'<p><small>Gợi ý cấu trúc: '+esc(q.h)+'</small></p><textarea id=ai rows=2 style="width:90%"></textarea><button onclick="gf()">Gửi</button>';
$('#main').innerHTML=(ban||'')+`<div class=card><small>Bước ${L.step+1}/11: ${STEPS[L.step]} – còn ${L.pend.length} mục</small><div class=bar><i style="width:${Math.round(L.step*100/11)}%"></i></div></div><div class=card>${b}</div>`}
function pass(){S.lesson.pend.shift();save();stepRender()}
function pk(i){_pk.push(i);$('#t'+i).style.display='none';$('#pk').textContent=_pk.map(j=>CQ.o[j]).join(' ')}
function go2(){if(_pk.length<CQ.o.length)return alert('Hãy dùng hết các từ');gr(nz(_pk.map(j=>CQ.o[j]).join(' '))==CQ.a[0])}
function gt(){const v=$('#ai').value.trim();if(!v)return;gr(CQ.a.includes(nz(v)))}
function gf(){const v=$('#ai').value.trim().toLowerCase();if(!v)return;gr(CQ.kw.every(r=>new RegExp(r).test(v)))}
function gr(ok){const L=S.lesson,q=CQ,first=!L.tried[q.id];L.tried[q.id]=1;
if(first&&q.sk){[q.sk,q.sk2].filter(Boolean).forEach(k=>{S.sk[k].n++;ok&&S.sk[k].ok++});ok&&L.ok++}
if(q.w){const w=S.words.find(x=>x.id==q.w);if(w){upd(w,ok);w.learned=w.learned||T()}}
L.pend.shift();let note='';
if(!ok){L.miss[q.id]=(L.miss[q.id]||0)+1;if(!q.f&&L.miss[q.id]<3){const z=L.pend.length&&/z$/.test(L.pend[L.pend.length-1])?1:0;L.pend.splice(L.pend.length-z,0,q.id);note='Bạn sẽ làm lại câu này ở cuối bước.'}else note=q.f?'':'Đã sai 3 lần: hãy ghi nhớ đáp án rồi đi tiếp.'}
if(!ok&&q.w){S.err.n++;if(S.err.n>=4&&!S.rescue){save();return startRescue()}}
save();hdr();$('#main').innerHTML=`<div class=card><h3 class="${ok?'g':'r'}">${ok?'Đúng':'Chưa đúng'}</h3><p>${q.e||''}</p>${!ok&&q.m&&q.t!='mc'?'<p>Đáp án mẫu: <b>'+esc(q.m)+'</b></p>':''}<p class=r>${note}</p><button onclick="stepRender()">Tiếp tục</button></div>`}
function fin(){const L=S.lesson,s=L.step,pct=L.tot?Math.round(L.ok*100/L.tot):100,m=$('#main');L.sc[s]=pct;save();
if(s==10){if(!L.fd){S.ft.push({d:T(),p:pct});L.fd=1;save()}
if(pct<80)return m.innerHTML=`<div class=card><h3 class=r>Final Test: ${pct}% – chưa đạt (cần 80%)</h3><p>Hãy làm lại bài kiểm tra cuối ngày.</p><button onclick="enter(10)">Làm lại Final Test</button></div>`;
S.done.includes(T())||S.done.push(T());S.ln=L.n+1;S.lesson=null;save();hdr();
return m.innerHTML=`<div class=card><h2 class=g>Hoàn thành bài hôm nay</h2><p>Final Test: ${pct}%</p><p>${L.sc.map((v,i)=>STEPS[i]+' '+v+'%').join(' · ')}</p><button onclick="go('garden')">Xem khu vườn</button></div>`}
m.innerHTML=`<div class=card><h3 class=g>Hoàn thành bước ${s+1}: ${STEPS[s]}</h3><p>Đúng ngay lần đầu: ${L.ok}/${L.tot} (${pct}%)</p><button onclick="enter(${s+1})">Mở bước ${s+2}: ${STEPS[s+1]}</button></div>`}
function SK(){const N={voc:'Vocabulary – Từ vựng',gra:'Grammar – Ngữ pháp',sen:'Sentence Building – Xây dựng câu',read:'Reading – Đọc hiểu',wri:'Writing – Viết',work:'Workplace Communication – Giao tiếp công việc'};
return '<h4>Kỹ năng (tính theo lần trả lời đầu tiên)</h4>'+Object.keys(N).map(k=>{const a=S.sk[k];return `<p>${N[k]}: ${a.n?a.ok+'/'+a.n+' đúng ('+Math.round(a.ok*100/a.n)+'%)':'Chưa có dữ liệu'}<div class=bar><i style="width:${a.n?a.ok*100/a.n:0}%"></i></div></p>`}).join('')+'<p>Listening – Nghe hiểu: chưa có bài tập nghe.</p>'}

const FM={due:'Cần ôn hôm nay',hard:'Từ khó',all:'Tất cả từ đã học',new:'Từ mới (xem trước)'},
fcDeck=k=>S.words.filter(w=>k=='new'?w.st=='New':w.st!='New'&&(k=='all'||(k=='due'?w.next<=T():w.st=='Difficult')));
V.flash=()=>{$('#main').innerHTML='<div class=card><h3>Flashcard</h3><p>Lật thẻ, tự nhớ nghĩa trước, rồi chọn Đã nhớ hoặc Chưa nhớ. Mỗi lượt tối đa 20 thẻ.</p>'+Object.keys(FM).map(k=>`<button onclick="fcStart('${k}')">${FM[k]} (${fcDeck(k).length})</button>`).join('')+'</div>'};
function fcStart(k){const d=sh(fcDeck(k)).slice(0,20);if(!d.length)return alert('Bộ thẻ này đang trống');window._fc={k,d:d.map(w=>w.id),i:0,dir:(window._fc||{}).dir||0,rq:{},ok:0};fcShow()}
function fcShow(){const F=_fc,w=S.words.find(x=>x.id==F.d[F.i]);if(!w)return fcEnd();
const en=esc(w.en)+'<small>'+esc(w.ipa)+'</small>',vi=esc(w.vi)+(w.ex?'<small>'+esc(w.ex)+'</small>':'');
$('#main').innerHTML=`<div class=card><small>Thẻ ${F.i+1}/${F.d.length}</small><div class=bar><i style="width:${Math.round(F.i*100/F.d.length)}%"></i></div><div class=fc onclick="fcFlip()"><div class=ff><div class=face>${F.dir?esc(w.vi):en}</div><div class="face back">${F.dir?en:vi}</div></div></div><p style="text-align:center"><small>Chạm vào thẻ để lật</small></p><div id=rt style="display:none"><button class=s onclick="fcRate(0)">Chưa nhớ</button><button onclick="fcRate(1)">Đã nhớ</button></div><button class=s onclick="fcSay()">Nghe</button><button class=s onclick="_fc.dir^=1;fcShow()">Đổi chiều</button></div>`}
function fcFlip(){$('.fc').classList.toggle('flip');$('#rt').style.display='block'}
function fcSay(){const w=S.words.find(x=>x.id==_fc.d[_fc.i]);if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}else alert('Thiết bị chưa hỗ trợ phát âm')}
function fcRate(ok){const F=_fc,w=S.words.find(x=>x.id==F.d[F.i]);if(ok)F.ok++;else{if(w.st!='New')w.next=T();if(!F.rq[w.id]){F.rq[w.id]=1;F.d.push(w.id)}}save();F.i++;fcShow()}
function fcEnd(){const F=_fc;$('#main').innerHTML=`<div class=card><h3 class=g>Hoàn thành lượt flashcard</h3><p>Đã nhớ ngay: ${F.ok}/${F.d.length-Object.keys(F.rq).length} thẻ. Thẻ chưa nhớ của từ đã học được đưa vào lịch ôn hôm nay. Flashcard không tự đánh dấu từ là đã ghi nhớ; việc đó chỉ xảy ra qua bài kiểm tra.</p><button onclick="fcStart('${F.k}')">Học tiếp bộ này</button><button class=s onclick="V.flash()">Chọn bộ khác</button></div>`}

const bars=(v,mx,lab,ok)=>{const n=v.length,w=300/n;return `<svg viewBox="0 0 300 92" width="100%" role="img">${v.map((x,i)=>{const hh=mx?Math.max(3,Math.round(60*x/mx)):3;return `<rect class="${x>0?(ok(x)?'b1':'b2'):'b0'}" x="${i*w+3}" y="${70-hh}" width="${w-6}" height="${hh}" rx="4"/><text x="${i*w+w/2}" y="86" text-anchor="middle" class="lb">${lab[i]}</text>`}).join('')}</svg>`};
function goLearn(){tab='lesson';hdr();if(S.lesson||S.done.includes(T())||(S.ln||0)>=BANK.length||S.words.filter(w=>w.st=='New').length<3)return LS();startLesson()}
V.home=()=>{const hr=+new Date().toLocaleString('en-US',{timeZone:'Asia/Ho_Chi_Minh',hour:'numeric',hour12:false})%24,gt=hr<12?'Chào buổi sáng':hr<18?'Chào buổi chiều':'Chào buổi tối',L=S.lesson,done=S.done.includes(T()),li=S.ln||0,left=li>=BANK.length;
let msg,btn,pct;
if(done&&!L){msg='Hôm nay bạn đã hoàn thành bài học. Hãy củng cố bằng flashcard hoặc ôn tập.';btn=`<button class=cta onclick="go('flash')">ÔN BẰNG FLASHCARD</button>`;pct=100}
else if(L){msg=`Bài ${L.n+1} đang học dở: bước ${L.step+1}/11 (${STEPS[L.step]}).`;btn=`<button class=cta onclick="goLearn()">TIẾP TỤC HỌC</button>`;pct=Math.round(L.step*100/11)}
else if(left){msg='Đã hết bài trong ngân hàng bài học hiện có. Hãy ôn tập và luyện flashcard.';btn=`<button class=cta onclick="go('flash')">LUYỆN FLASHCARD</button>`;pct=0}
else{msg=`Mục tiêu hôm nay: hoàn thành Bài ${li+1} (11 bước, 25–40 phút).`;btn=`<button class=cta onclick="goLearn()">BẮT ĐẦU HỌC</button>`;pct=0}
const days=[...Array(14)].map((_,i)=>add(T(),i-13)),sc=S.ft.slice(-10),dc=due().length,
st=[['New','Mới','#c3cfc6'],['Learning','Đang học','var(--b)'],['Reviewing','Đang ôn','var(--y)'],['Remembered','Đã nhớ','var(--g)'],['Difficult','Khó','#d0473a']],tot=S.words.length||1,
todo=[];if(S.rescue)todo.push(['RESCUE MODE: cần hoàn thành bài cứu cây',"rescueView()",'Làm ngay']);
if(L&&L.step==10)todo.push(['Final Test cuối ngày đang chờ bạn','goLearn()','Làm bài']);
if(L&&L.step<10)todo.push([`Bài ${L.n+1}: còn ${11-L.step} bước (bước ${L.step+1}: ${STEPS[L.step]})`,'goLearn()','Tiếp tục']);
if(dc)todo.push([`${dc} từ đến hạn ôn tập`,"go('review')",'Ôn tập']);
if(!L&&!done&&!left)todo.push([`Bài ${li+1} chưa bắt đầu`,'goLearn()','Bắt đầu']);
$('#main').innerHTML=`<div class=hero><p>${gt}${S.set.name?', '+esc(S.set.name):''}!</p><h2>${msg}</h2><div class=bar><i style="width:${pct}%"></i></div>${btn}</div>
<div class=grid><div class=k>Ngày liên tiếp<b>${streak()}</b></div><div class=k>Từ đã học<b>${learned().length}</b></div><div class=k>Cần ôn tập<b>${dc}</b></div><div class=k>Lượt sai còn lại<b>${Math.max(0,3-S.err.n)}</b></div></div>
<div class=card><h3>Việc cần làm</h3>${todo.length?todo.map(t=>`<div class=row><span>${esc(t[0])}</span><button onclick="${t[1]}">${t[2]}</button></div>`).join(''):'<p>Không có việc tồn đọng. Hãy luyện flashcard để củng cố từ vựng.</p>'}</div>
<div class=card><h3>Tiến độ học tập</h3><h4>14 ngày gần đây (ngày hoàn thành bài)</h4>${bars(days.map(d=>S.done.includes(d)?1:0),1,days.map(d=>d.slice(8)),x=>x>0)}
<h4>Điểm Final Test gần đây</h4>${sc.length?bars(sc.map(x=>x.p),100,sc.map(x=>x.d.slice(5)),x=>x>=80)+'<small>Xanh: đạt 80% trở lên</small>':'<p><small>Chưa có bài Final Test nào.</small></p>'}
<h4>Kho từ vựng (${S.words.length} từ)</h4><div class=stack>${st.map(s=>`<i style="width:${cnt(s[0])*100/tot}%;background:${s[2]}"></i>`).join('')}</div><small>${st.map(s=>`<span class=dot style="background:${s[2]}"></span>${s[1]} ${cnt(s[0])}`).join('')}</small></div>`};
V.lesson=LS;
init();hdr();go('home');cloudStatus(cloudSt);cloudPull();
</script></body></html>
