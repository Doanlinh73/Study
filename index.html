$('#main').innerHTML=`<div class=grid>${[['Từ vựng đã học',learned().length],['Từ đã thuộc',cnt('Remembered')],['Từ cần ôn',due().length],['Âm IPA đã học',ds+'/47'],['Âm IPA thành thạo',ms],['Điểm KT IPA (TB)',avg],['Streak',streak()],['Học hôm nay',(S.min[T()]||0)+' phút'],['Khu vườn','Cấp '+(stage()+1)+'/5']].map(x=>`<div class=k>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class=card><h3>Thời gian học 7 ngày (phút)</h3>${bars(mins,Math.max(10,...mins),d7.map(d=>d.slice(5)),x=>x>0)}</div><div class=card><h3>Điểm kiểm tra IPA gần đây</h3>${h.length?bars(h.slice(-10).map(x=>x.pct),100,h.slice(-10).map(x=>x.d.slice(5)),x=>x>=80)+'<small>Xanh: đạt 80% trở lên</small>':'<p>Chưa có bài kiểm tra IPA.</p>'}</div>`};
/* --- phân tích IPA của từ trong kho --- */
const SYMS=IPAL.map(x=>x.sym).sort((a,b)=>b.length-a.length);
function wIpa(id){const w=S.words.find(x=>x.id==id);if(!w)return;const ip=String(w.ipa||'').replace(/^\/|\/$/g,'').replace(/ɡ/g,'g'),j=s=>JSON.stringify(s).replace(/"/g,'&quot;');
if(!ip)return mopen(`<h3>${esc(w.en)}</h3><p>Từ này chưa có phiên âm IPA. Bấm Sửa để nhập.</p><button onclick="wForm('${w.id}')">Sửa từ</button><button class=l onclick="mclose()">Đóng</button>`);
const tk=[...new Set(ip.match(new RegExp(SYMS.join('|'),'g'))||[])],st=esc(ip).replace(/ˈ([^ˈˌ]*?(?:eɪ|aɪ|ɔɪ|əʊ|aʊ|ɪə|eə|ʊə|[iɪeæʌɑɒɔʊuəɜ]ː?))/,'ˈ<b>$1</b>');
mopen(`<h3>${esc(w.en)}</h3><p>${esc(w.vi)}</p><p style="font-size:22px">/${st}/</p><p><small>Trọng âm chính: phần in đậm sau dấu ˈ.</small></p><button onclick="speak(${j(w.en)})">🔊 Nghe</button><button class=s onclick="speak(${j(w.en)},.55)">🐢 Chậm</button><button class=s onclick="micCheck(${j(w.en)},-1)">🎤 Đọc thử</button><h4>Các âm trong từ</h4>${tk.map(t=>`<button class=l onclick="mclose();go('ipa');ipaLesson('${t}',1)">/${t}/</button>`).join('')||'—'}${w.ex?`<h4>Ví dụ</h4><p>${esc(w.ex)} <button class=l onclick="speak(${j(w.ex)})">🔊</button></p>`:''}<p><button class=l onclick="mclose()">Đóng</button></p>`)}
setInterval(()=>{if(document.visibilityState==='visible'&&S&&S.min){S.min[T()]=(S.min[T()]||0)+1;save()}},60000);

init();hdr();go('home');cloudStatus(cloudSt);cloudPull();
</script></body></html>
